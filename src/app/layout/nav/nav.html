
<nav class="navbar shadow-sm px-4">
  <!-- Existing Orantium logo -->
  <div class="flex-1">
    <a class="btn btn-ghost p-0 hover:bg-transparent">
      <img
        src="/Orantium logo.png"
        alt="Orantium Advisory Group"
        class="h-12 w-auto object-contain"
      />
    </a>
  </div>

  <!-- Navigation links -->
  <div class="flex-none flex items-center gap-3">
    <ul class="menu menu-horizontal px-1">
      <li><a>Home</a></li>
      <li><a>For Business</a></li>
      <li><a>Help</a></li>
    </ul>

    <!-- Login form from the reference screenshot -->
    <form class="flex items-center gap-2" (submit)="$event.preventDefault()">
      <input
      [(ngModel)]="creds.email"
      name="email"
        type="email"
        class="input input-sm w-32 bg-white text-slate-900"
        placeholder="Email"
        aria-label="Email"
      />

      <input
      [(ngModel)]="creds.password"
      name="password"
        type="password"
        class="input input-sm w-32 bg-white text-slate-900"
        placeholder="Password"
        aria-label="Password"
      />

      <button type="submit" class="btn btn-sm">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="8" r="4"></circle>
          <path d="M5 21v-2a7 7 0 0 1 14 0v2"></path>
        </svg>
        Login
      </button>

      <a class="btn btn-sm bg-[#D9B54A] text-[#071B3A]">
        Sign Up
      </a>
    </form>
  </div>
</nav>
